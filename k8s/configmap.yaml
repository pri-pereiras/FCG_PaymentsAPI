apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-config
data:
  ASPNETCORE_ENVIRONMENT: Development # Demonstração local: Swagger/dashboard; em produção use Production.
  RabbitMq__Host: rabbitmq
  RabbitMq__OrderQueue: payments-order-placed
  PaymentSimulation__MaximumApprovedAmount: "1000"
  PaymentSimulation__MaximumAttempts: "3"
  PaymentSimulation__RetryDelayMilliseconds: "250"
  PaymentSimulation__GatewayDelayMilliseconds: "150"
